<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>입찰 현황 — 관리자</title>
<link rel="stylesheet" href="assets/css/panel.css?v=27">
</head>
<body>

<div id="gate">
  <h2>입찰 현황</h2>
  <p>관리자 비밀번호를 입력하세요.</p>
  <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password">
  <button id="login">확인</button>
  <button class="ghost" id="preview" style="width:100%;margin-top:8px">품목만 미리보기</button>
  <div id="gate-msg"></div>
</div>

<div id="app" class="hide">
  <header>
    <div class="wrap">
      <h1>입찰 현황</h1>
      <div class="sub">품목별 접수 순서대로 순위 표시 · 먼저 넣은 사람이 1순위</div>
    </div>
  </header>

  <div class="toolbar">
    <div class="wrap toolbar-inner">
      <div class="searchrow">
        <input type="text" id="q" placeholder="품목 · 이름 · 연락처 검색">
        <button class="ghost" id="filtoggle" type="button">필터</button>
      </div>
      <div id="filters">
      <select id="cat"><option value="">전체 카테고리</option></select>
      <select id="who"><option value="">전체 입찰자</option></select>
      <span id="quickfil">
        <button data-st="active" class="on">진행중</button><button data-st="done">완료</button><button data-st="drop">취소</button><button data-st="">전체</button>
      </span>
      <select id="state">
        <option value="active" selected>진행중 (기본)</option>
        <option value="">전체 상태</option>
        <option value="done">거래완료</option>
        <option value="drop">취소</option>
      </select>
      <select id="group">
        <option value="none">그룹 없음</option>
        <option value="bidder">입찰자별 묶기</option>
        <option value="item">품목별 묶기</option>
      </select>
      <select id="sort" class="hide">
        <option value="recent">최근 입찰순</option>
        <option value="bids">입찰 많은 순</option>
        <option value="price">최고 금액순</option>
        <option value="name">품목 이름순</option>
      </select>
      <button class="ghost" id="addbid">+ 입찰 추가</button>
      <button class="ghost" id="sched">📅 일정</button>
      <button class="ghost" id="view">카드로 보기</button>
      <button class="ghost" id="export">백업 텍스트 복사</button>
      <button class="ghost" id="reload">새로고침</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div id="banner" class="hide"></div>
    <div id="syncmsg" class="syncmsg"></div>
    <div class="stats" id="stats"></div>
    <div id="legend"><i class="lg-contact"></i>연락함 <i class="lg-prog"></i>진행중 (메모 있음) <span>· 완료·취소 건은 위 필터에서</span></div>
    <div id="grid"></div>
    <div id="list" class="hide"></div>
    <details class="raw">
      <summary>원본 데이터 보기 (시트 그대로)</summary>
      <div class="rawtable" id="raw"></div>
    </details>
  </div>

  <div id="bidmodal">
    <div class="box">
      <h3 id="bm-title">입찰 추가</h3>
      <p>구글시트를 열지 않고 여기서 바로 고칠 수 있어요.</p>
      <label>품목</label>
      <input list="bm-items" id="bm-item" placeholder="품목명 (목록에서 고르거나 직접 입력)">
      <datalist id="bm-items"></datalist>
      <div class="two">
        <div><label>입찰자</label><input id="bm-name" placeholder="이름"></div>
        <div><label>연락처</label><input id="bm-contact" placeholder="01012345678"></div>
      </div>
      <div class="two">
        <div><label>금액</label><input id="bm-price" inputmode="numeric" placeholder="50000"></div>
        <div style="flex:0 0 76px"><label>수량</label><input id="bm-qty" inputmode="numeric" value="1"></div>
      </div>
      <label>접수 시각</label>
      <input id="bm-ts" placeholder="2026-07-14 12:58:52">
      <label>메모</label>
      <input id="bm-msg" placeholder="선택">
      <div class="msg" id="bm-msg-out"></div>
      <div class="row">
        <button class="ghost" id="bm-cancel">취소</button>
        <button id="bm-save">저장</button>
      </div>
    </div>
  </div>

  <div id="selbar" class="hide">
    <div class="wrap selbar-inner">
      <span id="selinfo"></span>
      <button class="ghost" id="selcopy">선택 내역 복사</button>
      <button class="ghost" id="selclear">선택 해제</button>
    </div>
  </div>
</div>

<script src="data/items-head.js"></script>
<script src="data/items/camera.js"></script>
<script src="data/items/strobe.js"></script>
<script src="data/items/mod.js"></script>
<script src="data/items/grip.js"></script>
<script src="data/items/pc.js"></script>
<script src="data/items/bg.js"></script>
<script src="data/items/fabric.js"></script>
<script src="data/items/propA.js"></script>
<script src="data/items/propB.js"></script>
<script src="data/items/office.js"></script>
<script src="data/items/etc.js"></script>
<script src="data/items.js"></script>
<!-- 로컬 전용 입찰 스냅샷 (.gitignore — 배포본엔 없음, 없으면 조용히 무시됨) -->
<script src="data/bids-local.js" onerror="void 0"></script>
<script src="assets/js/panel-data.js?v=27"></script>
<script src="assets/js/panel-sheet.js?v=27"></script>
<script src="assets/js/panel-view.js?v=27"></script>
<script src="assets/js/panel-app.js?v=27"></script>
</body>
</html>
